name: Build iOS IPA

on:
  push:
    branches: [main, develop]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug

env:
  SCHEME: RouaTrading
  CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}

jobs:
  build:
    name: Build & Archive IPA
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        working-directory: ios/RouaTrading
        run: |
          xcodegen generate
          echo "✅ Xcode project generated"
          ls -la *.xcodeproj 2>/dev/null || echo "No .xcodeproj found"

      - name: Resolve Swift Package Dependencies
        working-directory: ios/RouaTrading
        run: |
          xcodebuild -resolvePackageDependencies \
            -project RouaTrading.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build
        working-directory: ios/RouaTrading
        run: |
          xcodebuild build \
            -project RouaTrading.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -configuration ${{ env.CONFIGURATION }} \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tail -20

      - name: Archive (unsigned)
        working-directory: ios/RouaTrading
        run: |
          xcodebuild archive \
            -project RouaTrading.xcodeproj \
            -scheme ${{ env.SCHEME }} \
            -configuration ${{ env.CONFIGURATION }} \
            -destination 'generic/platform=iOS' \
            -archivePath build/RouaTrading.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SKIP_INSTALL=NO \
            | tail -20

      - name: Create IPA (unsigned for sideloading)
        working-directory: ios/RouaTrading/build
        run: |
          # Find the .app bundle in the archive
          APP_PATH=$(find RouaTrading.xcarchive/Products/Applications -name "*.app" 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found in archive — checking DerivedData..."
            APP_PATH=$(find ../build/Build/Products -name "*.app" 2>/dev/null | head -1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ ERROR: No .app bundle found anywhere"
            find . -name "*.app" 2>/dev/null
            exit 1
          fi
          
          echo "📦 Found app: $APP_PATH"
          mkdir -p ./ipa_output/Payload
          cp -r "$APP_PATH" ./ipa_output/Payload/
          cd ./ipa_output
          zip -r RouaTrading.ipa Payload/
          echo "✅ IPA created: $(ls -lh RouaTrading.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouaTrading-iOS-IPA
          path: ios/RouaTrading/build/ipa_output/RouaTrading.ipa
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ios/RouaTrading/build/*.log
            ios/RouaTrading/xcodebuild-*.log
          retention-days: 7
