name: Build Roua Trading Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════════
  # 🍎 iOS Build — يعمل على macOS runner مجاني
  # ══════════════════════════════════════════════
  build-ios:
    runs-on: macos-14
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠 Setup Xcode 15.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.2'

      - name: 📦 Resolve Swift Package Dependencies
        run: |
          cd ios/RouaTrading
          swift package resolve 2>&1 || true

      - name: 🔨 Build iOS App (Unsigned)
        run: |
          cd ios/RouaTrading
          
          # إنشاء مشروع Xcode من Package.swift
          swift package generate-xcodeproj 2>&1 || true
          
          # البناء بدون توقيع
          xcodebuild \
            -scheme RouaTradingApp \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GENERATE_PROFILING_CODE=NO \
            2>&1 | tee build.log
          
          # التحقق من نجاح البناء
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ Build failed! Showing last 50 lines:"
            tail -50 build.log
            exit 1
          fi

      - name: 📱 Create .ipa file
        run: |
          # البحث عن ملف .app المبني
          APP_PATH=$(find ios/RouaTrading/build -name "*.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found! Trying alternative path..."
            APP_PATH=$(find ios/RouaTrading/build -name "RouaTrading*.app" -type d | head -1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Build output not found!"
            find ios/RouaTrading/build -type f -name "*.app" 2>/dev/null || true
            ls -la ios/RouaTrading/build/Build/Products/ 2>/dev/null || true
            exit 1
          fi
          
          echo "✅ Found app at: $APP_PATH"
          
          # إنشاء ملف .ipa
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r RouaTrading.ipa Payload/
          rm -rf Payload
          
          echo "✅ .ipa created successfully!"
          ls -lh RouaTrading.ipa

      - name: 📤 Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouaTrading-iOS-ipa
          path: RouaTrading.ipa
          retention-days: 30

  # ══════════════════════════════════════════════
  # 🤖 Android Build — يعمل على Ubuntu runner
  # ══════════════════════════════════════════════
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔨 Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug 2>&1 || {
            echo "⚠️ Gradle wrapper not found. Creating it..."
            gradle wrapper
            ./gradlew assembleDebug
          }

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouaTrading-Android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn
