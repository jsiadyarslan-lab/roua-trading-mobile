---
format_version: '12'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

title: Roua Trading — Build iOS IPA (unsigned for sideloading)

workflows:
  _setup:
    steps:
      - script@1:
          title: Install XcodeGen
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                if ! command -v xcodegen &> /dev/null; then
                  brew install xcodegen
                else
                  echo "XcodeGen already installed"
                fi

      - script@1:
          title: Generate Xcode Project
          inputs:
            - working_dir: "$BITRISE_SOURCE_DIR/ios/RouaTrading"
            - content: |-
                #!/usr/bin/env bash
                set -e
                xcodegen generate
                echo "Xcode project generated"
                ls -la *.xcodeproj 2>/dev/null || echo "No .xcodeproj found"

      - xcode-select@0:
          title: Select Xcode 15
          inputs:
            - xcode_version: '15.4'

  build-ipa:
    title: Build IPA (unsigned)
    summary: Build unsigned IPA for sideloading via AltStore/Sideloadly
    before_run:
      - _setup
    steps:
      - xcode-build@0:
          title: Build & Archive
          inputs:
            - project_path: "$BITRISE_SOURCE_DIR/ios/RouaTrading/RouaTrading.xcodeproj"
            - scheme: RouaTrading
            - configuration: Release
            - destination: generic/platform=iOS
            - archive_path: "$BITRISE_SOURCE_DIR/ios/RouaTrading/build/RouaTrading.xcarchive"
            - xcodebuild_options: >-
                CODE_SIGNING_ALLOWED=NO
                CODE_SIGN_IDENTITY=""
                CODE_SIGNING_REQUIRED=NO
                COMPILER_INDEX_STORE_ENABLE=NO
                SKIP_INSTALL=NO
            - export_method: ''
            - generate_archive: true

      - script@1:
          title: Create unsigned IPA
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e

                ARCHIVE_DIR="$BITRISE_SOURCE_DIR/ios/RouaTrading/build/RouaTrading.xcarchive"
                IPA_DIR="$BITRISE_SOURCE_DIR/ios/RouaTrading/build/ipa_output"

                # Find .app in archive
                APP_PATH=$(find "$ARCHIVE_DIR/Products/Applications" -name "*.app" 2>/dev/null | head -1)

                if [ -z "$APP_PATH" ]; then
                  echo "No .app in archive, checking DerivedData..."
                  APP_PATH=$(find "$BITRISE_SOURCE_DIR/ios/RouaTrading/build" -name "*.app" -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
                fi

                if [ -z "$APP_PATH" ]; then
                  echo "ERROR: No .app bundle found"
                  find "$BITRISE_SOURCE_DIR/ios/RouaTrading/build" -name "*.app" 2>/dev/null
                  exit 1
                fi

                echo "Found app: $APP_PATH"

                # Create IPA structure
                mkdir -p "$IPA_DIR/Payload"
                cp -r "$APP_PATH" "$IPA_DIR/Payload/"
                cd "$IPA_DIR"
                zip -r RouaTrading.ipa Payload/

                echo "IPA created:"
                ls -lh RouaTrading.ipa

                # Set output env
                envman add --key BITRISE_IPA_PATH --value "$IPA_DIR/RouaTrading.ipa"

      - deploy-to-bitrise-io@2:
          title: Upload IPA artifact
          inputs:
            - deploy_path: "$BITRISE_SOURCE_DIR/ios/RouaTrading/build/ipa_output/RouaTrading.ipa"
            - is_compress: false
            - notify_user_groups: none

      - script@1:
          title: Build summary
          inputs:
            - content: |-
                #!/usr/bin/env bash
                echo "========================================"
                echo "  IPA Build Complete!"
                echo "========================================"
                echo ""
                echo "Download the IPA from the Artifacts tab."
                echo "Install via Sideloadly or AltStore."
                echo ""
                ls -lh "$BITRISE_SOURCE_DIR/ios/RouaTrading/build/ipa_output/RouaTrading.ipa" 2>/dev/null || echo "IPA not found at expected path"
