---
format_version: '12'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

workflows:
  build-ipa:
    title: Build IPA (unsigned)
    summary: Build unsigned IPA for sideloading via AltStore/Sideloadly
    steps:
      - script@1:
          title: Install XcodeGen
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                brew install xcodegen 2>/dev/null || echo "XcodeGen already available"

      - script@1:
          title: Generate Xcode Project
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                cd "$BITRISE_SOURCE_DIR/ios/RouaTrading"
                xcodegen generate
                echo "Generated project:"
                ls -la *.xcodeproj

      - script@1:
          title: Build & Archive (unsigned)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                cd "$BITRISE_SOURCE_DIR/ios/RouaTrading"

                xcodebuild archive \
                  -project RouaTrading.xcodeproj \
                  -scheme RouaTrading \
                  -configuration Release \
                  -destination 'generic/platform=iOS' \
                  -archivePath build/RouaTrading.xcarchive \
                  CODE_SIGNING_ALLOWED=NO \
                  CODE_SIGN_IDENTITY="" \
                  CODE_SIGNING_REQUIRED=NO \
                  COMPILER_INDEX_STORE_ENABLE=NO \
                  SKIP_INSTALL=NO \
                  | tail -30

      - script@1:
          title: Create IPA
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e

                ARCHIVE_DIR="$BITRISE_SOURCE_DIR/ios/RouaTrading/build/RouaTrading.xcarchive"
                IPA_DIR="$BITRISE_SOURCE_DIR/ios/RouaTrading/build/ipa_output"

                # Find .app in archive
                APP_PATH=$(find "$ARCHIVE_DIR/Products/Applications" -name "*.app" 2>/dev/null | head -1)

                if [ -z "$APP_PATH" ]; then
                  echo "No .app in archive, checking DerivedData..."
                  APP_PATH=$(find "$BITRISE_SOURCE_DIR/ios/RouaTrading/build" -name "*.app" -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
                fi

                if [ -z "$APP_PATH" ]; then
                  echo "ERROR: No .app bundle found"
                  find "$BITRISE_SOURCE_DIR" -name "*.app" 2>/dev/null
                  exit 1
                fi

                echo "Found app: $APP_PATH"
                mkdir -p "$IPA_DIR/Payload"
                cp -r "$APP_PATH" "$IPA_DIR/Payload/"
                cd "$IPA_DIR"
                zip -r RouaTrading.ipa Payload/
                echo "IPA created:"
                ls -lh RouaTrading.ipa

                envman add --key BITRISE_IPA_PATH --value "$IPA_DIR/RouaTrading.ipa"

      - deploy-to-bitrise-io@2:
          title: Upload IPA
          inputs:
            - deploy_path: "$BITRISE_SOURCE_DIR/ios/RouaTrading/build/ipa_output/RouaTrading.ipa"
            - is_compress: false
