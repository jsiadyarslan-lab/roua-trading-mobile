---
format_version: '12'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

workflows:
  primary:
    title: Build Unsigned IPA
    meta:
      bitrise.io:
        stack: osx-xcode-26.5.x
        machine_type_id: g2.mac.large
    steps:
      - git-clone@8: {}
      - script@1:
          title: Install XcodeGen
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                brew install xcodegen 2>/dev/null || echo "XcodeGen already available"
                xcodegen --version

      - script@1:
          title: Generate Xcode Project (no signing)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                cd "$BITRISE_SOURCE_DIR/ios/RouaTrading"
                cat project.yml | \
                  sed 's/CODE_SIGN_STYLE: Automatic/CODE_SIGN_STYLE: Manual/' | \
                  sed 's/CODE_SIGN_IDENTITY: "Apple Development"/CODE_SIGN_IDENTITY: ""/' | \
                  sed 's/CODE_SIGN_IDENTITY: "Apple Distribution"/CODE_SIGN_IDENTITY: ""/' | \
                  sed 's/CODE_SIGNING_REQUIRED: true/CODE_SIGNING_REQUIRED: false/' | \
                  sed 's/DEVELOPMENT_TEAM: "\${APPLE_TEAM_ID}"/DEVELOPMENT_TEAM: ""/' \
                  > project_unsigned.yml
                mv project.yml project.yml.bak
                mv project_unsigned.yml project.yml
                xcodegen generate
                ls -la *.xcodeproj

      - script@1:
          title: Resolve SPM Dependencies
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                cd "$BITRISE_SOURCE_DIR/ios/RouaTrading"
                xcodebuild -resolvePackageDependencies \
                  -project RouaTrading.xcodeproj \
                  -scheme RouaTrading \
                  -clonedSourcePackagesDirPath SourcePackages \
                  2>&1 | tail -20

      - script@1:
          title: Build (unsigned)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                cd "$BITRISE_SOURCE_DIR/ios/RouaTrading"
                mkdir -p build_output
                xcodebuild build \
                  -project RouaTrading.xcodeproj \
                  -scheme RouaTrading \
                  -configuration Release \
                  -sdk iphoneos \
                  -derivedDataPath build_output/DerivedData \
                  COMPILER_INDEX_STORE_ENABLE=NO \
                  CODE_SIGNING_ALLOWED=NO \
                  CODE_SIGN_IDENTITY="" \
                  CODE_SIGNING_REQUIRED=NO \
                  DEVELOPMENT_TEAM="" \
                  PROVISIONING_PROFILE_SPECIFIER="" \
                  SKIP_INSTALL=NO \
                  2>&1 | tail -50
                find build_output/DerivedData -name "*.app" 2>/dev/null || echo "No .app found"

      - script@1:
          title: Create IPA
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e
                APP_PATH=$(find "$BITRISE_SOURCE_DIR/ios/RouaTrading/build_output/DerivedData" -name "*.app" -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
                if [ -z "$APP_PATH" ]; then
                  APP_PATH=$(find "$BITRISE_SOURCE_DIR/ios/RouaTrading/build_output" -name "*.app" 2>/dev/null | head -1)
                fi
                if [ -z "$APP_PATH" ]; then
                  echo "ERROR: No .app found"
                  find "$BITRISE_SOURCE_DIR" -name "*.app" 2>/dev/null
                  exit 1
                fi
                echo "Found: $APP_PATH"
                IPA_DIR="$BITRISE_SOURCE_DIR/ipa_output"
                mkdir -p "$IPA_DIR/Payload"
                cp -r "$APP_PATH" "$IPA_DIR/Payload/"
                cd "$IPA_DIR"
                zip -r RouaTrading.ipa Payload/
                ls -lh RouaTrading.ipa
                envman add --key BITRISE_IPA_PATH --value "$IPA_DIR/RouaTrading.ipa"

      - deploy-to-bitrise-io@2:
          title: Upload IPA
          inputs:
            - deploy_path: "$BITRISE_SOURCE_DIR/ipa_output/RouaTrading.ipa"
            - is_compress: false
