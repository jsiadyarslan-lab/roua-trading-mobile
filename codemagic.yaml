workflows:
  build-ipa:
    name: Build Unsigned IPA
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen 2>/dev/null || echo "XcodeGen already available"
          xcodegen --version

      - name: Generate Xcode Project (no signing)
        script: |
          cd ios/RouaTrading
          cat project.yml | \
            sed 's/CODE_SIGN_STYLE: Automatic/CODE_SIGN_STYLE: Manual/' | \
            sed 's/CODE_SIGN_IDENTITY: "Apple Development"/CODE_SIGN_IDENTITY: ""/' | \
            sed 's/CODE_SIGN_IDENTITY: "Apple Distribution"/CODE_SIGN_IDENTITY: ""/' | \
            sed 's/CODE_SIGNING_REQUIRED: true/CODE_SIGNING_REQUIRED: false/' | \
            sed 's/DEVELOPMENT_TEAM: "\${APPLE_TEAM_ID}"/DEVELOPMENT_TEAM: ""/' \
            > project_unsigned.yml
          mv project.yml project.yml.bak
          mv project_unsigned.yml project.yml
          xcodegen generate
          echo "Generated project:"
          ls -la *.xcodeproj
          echo "Schemes available:"
          xcodebuild -project RouaTrading.xcodeproj -list

      - name: Resolve SPM Dependencies
        script: |
          cd ios/RouaTrading
          xcodebuild -resolvePackageDependencies \
            -project RouaTrading.xcodeproj \
            -scheme RouaTrading \
            -clonedSourcePackagesDirPath SourcePackages 2>&1 | tail -30

      - name: Build (unsigned)
        script: |
          cd ios/RouaTrading
          xcodebuild archive \
            -project RouaTrading.xcodeproj \
            -scheme RouaTrading \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/RouaTrading.xcarchive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SKIP_INSTALL=NO \
            INSTALL_PATH=/Applications \
            2>&1 | tail -100
          
          echo ""
          echo "=== Build result ==="
          echo "Archive exists: $(ls build/RouaTrading.xcarchive 2>/dev/null && echo YES || echo NO)"
          find build/RouaTrading.xcarchive -type f 2>/dev/null | head -30
          find build -name "*.app" 2>/dev/null

      - name: Create IPA
        script: |
          APP_PATH=$(find ios/RouaTrading/build/RouaTrading.xcarchive/Products/Applications -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ios/RouaTrading/build -name "*.app" 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "*.app" -path "*/Release-iphoneos/*" 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found anywhere"
            exit 1
          fi
          echo "Found: $APP_PATH"
          mkdir -p ipa_output/Payload
          cp -r "$APP_PATH" ipa_output/Payload/
          cd ipa_output
          zip -r RouaTrading.ipa Payload/
          ls -lh RouaTrading.ipa

    artifacts:
      - ipa_output/RouaTrading.ipa
