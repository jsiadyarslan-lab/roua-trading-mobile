workflows:
  build-ipa:
    name: Build Unsigned IPA
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen 2>/dev/null || echo "XcodeGen already available"
          xcodegen --version

      - name: Generate Xcode Project (no signing)
        script: |
          cd ios/RouaTrading
          # Disable code signing in project.yml
          cat project.yml | \
            sed 's/CODE_SIGN_STYLE: Automatic/CODE_SIGN_STYLE: Manual/' | \
            sed 's/CODE_SIGN_IDENTITY: "Apple Development"/CODE_SIGN_IDENTITY: ""/' | \
            sed 's/CODE_SIGN_IDENTITY: "Apple Distribution"/CODE_SIGN_IDENTITY: ""/' | \
            sed 's/CODE_SIGNING_REQUIRED: true/CODE_SIGNING_REQUIRED: false/' | \
            sed 's/DEVELOPMENT_TEAM: "\${APPLE_TEAM_ID}"/DEVELOPMENT_TEAM: ""/' \
            > project_unsigned.yml
          mv project.yml project.yml.bak
          mv project_unsigned.yml project.yml
          xcodegen generate
          echo "Generated project:"
          ls -la *.xcodeproj

      - name: Resolve SPM Dependencies
        script: |
          cd ios/RouaTrading
          xcodebuild -resolvePackageDependencies \
            -project RouaTrading.xcodeproj \
            -scheme RouaTrading \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build (unsigned)
        script: |
          cd ios/RouaTrading
          set -o pipefail
          xcodebuild archive \
            -project RouaTrading.xcodeproj \
            -scheme RouaTrading \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/RouaTrading.xcarchive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SKIP_INSTALL=NO \
            INSTALL_PATH=/Applications \
            | xcpretty || true
          
          echo "=== Archive contents ==="
          find build/RouaTrading.xcarchive -name "*.app" 2>/dev/null
          ls -la build/RouaTrading.xcarchive/Products/Applications/ 2>/dev/null || echo "No Applications dir"

      - name: Create IPA
        script: |
          # Find the .app from the archive
          APP_PATH=$(find ios/RouaTrading/build/RouaTrading.xcarchive/Products/Applications -name "*.app" 2>/dev/null | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "No .app in archive, searching DerivedData..."
            APP_PATH=$(find ios/RouaTrading/build -name "*.app" 2>/dev/null | head -1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found!"
            echo "=== Searching entire project ==="
            find . -name "*.app" 2>/dev/null
            echo "=== Archive structure ==="
            find ios/RouaTrading/build -type f 2>/dev/null | head -30
            exit 1
          fi
          
          echo "Found app: $APP_PATH"
          echo "App contents:"
          ls -la "$APP_PATH/" | head -20
          
          # Verify the app has an executable
          APP_NAME=$(basename "$APP_PATH" .app)
          if [ ! -f "$APP_PATH/$APP_NAME" ]; then
            echo "ERROR: No executable found in .app bundle at $APP_PATH/$APP_NAME"
            echo "App bundle contents:"
            find "$APP_PATH" -type f 2>/dev/null
            exit 1
          fi
          
          echo "Executable found: $APP_PATH/$APP_NAME"
          echo "Executable size: $(du -h "$APP_PATH/$APP_NAME" | cut -f1)"
          
          mkdir -p ipa_output/Payload
          cp -r "$APP_PATH" ipa_output/Payload/
          cd ipa_output
          zip -r RouaTrading.ipa Payload/
          echo "IPA created:"
          ls -lh RouaTrading.ipa

    artifacts:
      - ipa_output/RouaTrading.ipa
