# Roua Trading — Codemagic CI/CD
# Builds unsigned IPA for sideloading (AltStore / Sideloadly)
workflows:
  ios-unsigned-ipa:
    name: Roua Trading iOS (Unsigned IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: none  # No signing — unsigned IPA
      vars:
        XCODE_PROJECT: RouaTrading.xcodeproj
        XCODE_SCHEME: RouaTrading
        BUNDLE_ID: com.roua.trading
      xcode: "16.0"

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen 2>/dev/null || true

      - name: Generate Xcode project
        script: |
          cd ios/RouaTrading
          # Remove old xcodeproj to force clean regeneration
          rm -rf RouaTrading.xcodeproj
          xcodegen generate
          echo "Generated project:"
          ls -la *.xcodeproj
          echo "Available schemes:"
          xcodebuild -project RouaTrading.xcodeproj -list

      - name: Resolve SPM dependencies
        script: |
          cd ios/RouaTrading
          xcodebuild -resolvePackageDependencies \
            -project $XCODE_PROJECT \
            -scheme $XCODE_SCHEME \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build unsigned IPA
        script: |
          cd ios/RouaTrading
          xcodebuild archive \
            -project $XCODE_PROJECT \
            -scheme $XCODE_SCHEME \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/RouaTrading.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SKIP_INSTALL=NO \
            INSTALL_PATH=/Applications \
            2>&1 | tee build.log

          echo "Build exit code: $?"

      - name: Export IPA from archive
        script: |
          APP_PATH=$(find ios/RouaTrading/build/RouaTrading.xcarchive/Products/Applications -name "*.app" 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app in archive Applications. Searching..."
            APP_PATH=$(find ios/RouaTrading/build -name "*.app" 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found anywhere"
            echo "Build artifacts:"
            find ios/RouaTrading/build -type f 2>/dev/null | head -30
            echo "---"
            echo "Build log errors:"
            rg "error:" ios/RouaTrading/build.log 2>/dev/null || tail -100 ios/RouaTrading/build.log 2>/dev/null
            exit 1
          fi
          echo "Found .app: $APP_PATH"
          ls -la "$APP_PATH/" | head -10
          mkdir -p ipa_output/Payload
          cp -r "$APP_PATH" ipa_output/Payload/
          cd ipa_output
          zip -r RouaTrading.ipa Payload/
          rm -rf Payload
          echo "IPA created:"
          ls -lh RouaTrading.ipa

    artifacts:
      - ipa_output/RouaTrading.ipa
