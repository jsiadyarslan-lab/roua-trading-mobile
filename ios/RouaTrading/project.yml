name: RouaTrading
options:
  bundleIdPrefix: com.roua
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""

targets:
  RouaTrading:
    type: application
    platform: iOS
    sources:
      - path: RouaTrading/Sources
        excludes:
          - "**/.DS_Store"
    resources:
      - path: RouaTrading/Sources/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roua.trading
        INFOPLIST_FILE: RouaTrading/Sources/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: RouaTrading/Sources/Resources/RouaTrading.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false
        SWIFT_EMIT_LOC_STRINGS: true
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: LightweightCharts
        product: LightweightCharts

packages:
  LightweightCharts:
    url: https://github.com/tradingview/LightweightChartsIOS
    from: "4.0.0"
